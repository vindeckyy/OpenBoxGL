schema_version: 1
adapter_id: scummvm-scummvm
emulator_id: org.scummvm.ScummVM
label: ScummVM
platform: ScummVM
extensions:
  - scummvm
native_exe: scummvm
flatpak_app_id: org.scummvm.ScummVM
startup_args:
  - "{path}"
recommended: true
priority: 10
executable_patterns:
  - scummvm
state:
  kind: adapter-cli
  template: "--savepath={state_dir} --save-slot=0"
  capture: "--savepath={state_dir}"
  glob: "*.s??"
