schema_version: 1
adapter_id: retroarch-gba
emulator_id: org.libretro.RetroArch
label: RetroArch
platform: Game Boy Advance
extensions:
  - gba
native_exe: retroarch
flatpak_app_id: org.libretro.RetroArch
startup_args:
  - -L
  - /usr/lib/libretro/mgba_libretro.so
  - "{path}"
recommended: true
priority: 10
executable_patterns:
  - retroarch
state:
  kind: retroarch
  template: "-s {state_path} --appendconfig {state_config}"
  capture: "--appendconfig {state_config}"
  glob: "*.state*"
