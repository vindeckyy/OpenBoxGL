schema_version: 1
adapter_id: pcsx2-ps2
emulator_id: net.pcsx2.PCSX2
label: PCSX2
platform: PlayStation 2
extensions:
  - iso
  - chd
  - ciso
native_exe: pcsx2-qt
native_exe_windows: pcsx2-qt.exe
# The upstream macOS build ships a versioned bundle name (PCSX2-v2.8.2.app).
native_exe_macos: "PCSX2*.app"
flatpak_app_id: net.pcsx2.PCSX2
startup_args:
  - -batch
  - "{path}"
bios_path: ~/.config/PCSX2/bios
recommended: true
priority: 10
executable_patterns:
  - pcsx2-qt
state:
  kind: adapter-cli
  template: "-statefile {state_path}"
  capture: ""
  glob: "*.p2s*"
