terms:
  - term: "Bug candidate"
    definition: "A symptom, failing check, console error, network failure, or invariant violation not yet proven to be a product defect."
  - term: "Confirmed defect"
    definition: "A candidate with a deterministic reproduction or measured failure rate and a named root cause whose mechanism can be toggled green/red."
  - term: "Rejected candidate"
    definition: "A candidate shown by evidence to be expected behavior, fixture/environment failure, duplicate, or non-reproducible after bounded attempts."
  - term: "P1"
    definition: "Broken for users now; highest same-day fix priority."
  - term: "P2"
    definition: "Wrong or risky behavior that should be scheduled or fixed after P1 findings."
  - term: "P3"
    definition: "Debt, cosmetic issue, or low-impact idea recorded but not fixed in this sweep."
  - term: "Critical journey"
    definition: "A user-visible path spanning browser UI, REST API, and persisted state: library load, settings save, import, launch/session, saves, update, or integration status."
  - term: "Isolated data root"
    definition: "Temporary HOME/XDG directories used by the sweep so no real OpenBox library, settings, backups, plugins, or secrets are modified."
  - term: "Regression test"
    definition: "A test derived from the reproduction that fails against the defective behavior and passes only after the fix."
  - term: "Sweep evidence"
    definition: "Exact commands, outputs, screenshots, console/network diagnostics, reproduction steps, and disposition stored under specs/verifications/."
  - term: "Public settings"
    definition: "The sanitized settings dictionary returned by public_settings(); it must never expose raw passwords or tokens."
  - term: "Partial settings update"
    definition: "A settings POST that omits unrelated keys; save_settings must merge those keys instead of resetting them."
  - term: "Background job"
    definition: "A long-running operation such as Gameyfin installation that returns promptly and exposes bounded status polling rather than blocking an HTTP handler."
  - term: "Stop condition"
    definition: "The point where the same-day fix budget expires or a finding requires redesign/external access; evidence is recorded and work is deferred rather than rushed."
