initiative_id: e01
feature_name: "OpenBox same-day bug sweep"
date: 2026-07-26
owner: "OpenBox maintainer"
core_value: "Find, prove, prioritize, and safely remove the highest-impact defects in OpenBox without destabilizing the current v0.4.5 release line or overwriting unrelated legal-document work."
summary: |
  This initiative performs a time-boxed, evidence-driven bug sweep across OpenBox's automated
  suite, token-authenticated REST API, browser interface, import and launch workflows, settings,
  sessions, updates, saves/backups, plugins, and packaging surface. The sweep starts from a cleanly
  recorded baseline, attacks known error-prone boundaries, exercises critical user journeys in an
  isolated data directory, and converts every credible symptom into either a deterministic
  reproduction or an explicitly rejected candidate with evidence.

  Confirmed P1 and P2 defects that fit a bounded patch are fixed today using red-green regression
  tests. Findings that require redesign, unavailable external services, destructive real-user data,
  or more time than the fix budget are recorded and prioritized rather than fixed speculatively.
  The final outcome is an auditable sweep report, regression evidence, a green full suite and
  packaging check, and an updated issue/state handoff.
users:
  - "OpenBox players relying on library, launch, settings, import, saves, and update workflows"
  - "OpenBox maintainers who need reproducible defects and reliable regression evidence"
in_scope:
  - id: e01s01
    outcome: "Establish a reproducible baseline and run automated fault probes across all existing test groups."
  - id: e01s02
    outcome: "Adversarially sweep REST API authorization, validation, exception, partial-update, and background-job boundaries."
  - id: e01s03
    outcome: "Exercise critical browser journeys against isolated test data and record visual/console/network evidence."
  - id: e01s04
    outcome: "Confirm root causes and fix the highest-priority reproducible P1/P2 defects that fit the same-day patch budget."
  - id: e01s05
    outcome: "Run whole-product regression and packaging gates, reconcile findings, and publish the sweep handoff."
out_of_scope:
  - item: "New product features, visual redesigns, broad refactors, or speculative abstractions"
    reason: "They obscure defect isolation and exceed a same-day reliability sweep."
  - item: "Fixing P3 cosmetic/debt findings during the sweep"
    reason: "P3 items are recorded for later so the fix budget remains focused on user-impacting failures."
  - item: "Redesigning a subsystem when a confirmed bug reveals architectural debt"
    reason: "The bug is documented with root cause and escalated to a separately scoped feature/refactor plan."
  - item: "Live destructive testing against the maintainer's real ~/.local/share/openbox data"
    reason: "All mutation tests use an isolated temporary XDG data root to protect user libraries and secrets."
  - item: "Requiring Steam, Heroic, Lutris, Gameyfin, IGDB, RetroAchievements, or network credentials"
    reason: "External-service behavior is tested with existing fixtures, missing-credential paths, controlled local responses, or recorded as externally blocked."
  - item: "Launching real games or running untrusted third-party plugins"
    reason: "Launch and plugin contracts are exercised with safe fixture commands and test plugins only."
  - item: "Committing, releasing, publishing, or modifying the current unrelated legal/trademark working-tree changes"
    reason: "Those changes predate the sweep and remain user-owned unless a reproduced bug directly requires a narrowly reviewed edit."
constraints:
  timebox: "One working day: approximately 6.5 hours of execution plus explicit stop/handoff."
  fix_budget: "At most 3 hours for confirmed P1/P2 patches; prioritize severity, reproducibility, blast radius, then fix cost."
  platform: "Linux-first; Python 3 and existing repository scripts; browser UI served by web_app.py."
  dependencies: "No new external package. [OK] Python standard library and existing repository/browser tooling only."
  data_safety: "Use temporary XDG_CONFIG_HOME/XDG_DATA_HOME/HOME and fixture libraries; never mutate real user data."
  concurrency: "Do not run openbox.py and web_app.py concurrently because the UIs have no shared file lock."
  working_tree: "Preserve pre-existing modifications in DISCLAIMER.md, README.md, SECURITY.md, index.html, openbox.desktop, openbox.metainfo.xml, test_packaging.py, and TRADEMARKS.md."
  behavior_changes: "Every fixed defect must have a regression test that fails without the patch."
  root_cause_gate: "No fix on hypothesis; reproduce, discriminate, and state mechanism plus trigger before editing production behavior."
success_criteria:
  - id: SC-e01s01-P1-01
    outcome: "The complete pre-sweep test baseline is recorded, including exact command, commit, dirty-tree context, exit status, and warnings."
    verify: "./run_all_tests.sh"
  - id: SC-e01s02-P0-01
    outcome: "Critical API boundaries have explicit success and failure-path evidence without authorization bypass, dropped connections, or unrelated setting resets."
    verify: "python3 -B test_parity_api.py && python3 -B test_sessions.py && python3 -B test_updates.py && python3 -B test_secrets.py"
  - id: SC-e01s03-P1-01
    outcome: "Critical browser journeys are completed against isolated data with screenshots plus console/network diagnostics and every anomaly triaged."
    verify: "test -f specs/verifications/e01s03-browser-sweep.md && ! grep -q '\[ \]' specs/verifications/e01s03-browser-sweep.md"
  - id: SC-e01s04-P0-01
    outcome: "Every confirmed P1/P2 candidate has a named root cause and is either fixed with a red-green regression test or explicitly deferred with rationale."
    verify: "test -f specs/verifications/e01s04-fix-ledger.md && ! grep -Eq 'status: (untriaged|fixing|unverified)' specs/verifications/e01s04-fix-ledger.md"
  - id: SC-e01s05-P1-01
    outcome: "The final full test suite, syntax check, packaging tests, and issue reconciliation pass with evidence."
    verify: "python3 -m compileall -q . && ./run_all_tests.sh && python3 -B test_packaging.py"
references:
  - ".agent/OPERATING.md"
  - ".agent/PROJECT.md"
  - ".agent/STATE.md"
  - ".agent/ISSUES.md"
  - ".agent/workflows/debug.md"
  - ".agent/workflows/patch.md"
  - "specs/IMPACT_LATEST.md"
  - "specs/epics/e01-bug-sweep/epic.yaml"
