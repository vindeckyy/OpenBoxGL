name: macOS host debug

# Temporary workflow: runs the native host self test with its scratch data
# directory kept and uploaded, so a boot failure shows its logs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python-version: "3.12"
          - runner: macos-15-intel
            python-version: "3.12"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Probe loopback reverse lookup
        run: |
          python - <<'PY'
          import socket
          import time
          start = time.perf_counter()
          try:
              name = socket.getfqdn("127.0.0.1")
          except OSError as error:
              name = f"error: {error}"
          elapsed = (time.perf_counter() - start) * 1000.0
          print(f"getfqdn(127.0.0.1) = {name!r} in {elapsed:.1f} ms")
          PY

      - name: Build the macOS native host
        run: scripts/build_native_host_macos.sh

      - name: Self test with diagnostics
        env:
          TMPDIR: ${{ runner.temp }}/host-debug
          OPENBOX_SELFTEST_KEEP: "1"
        run: |
          mkdir -p "$TMPDIR"
          OPENBOX_PYTHON="$(command -v python)" ./native_host --selftest

      - name: Upload the self test data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: host-debug-${{ matrix.runner }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/host-debug/**
          if-no-files-found: warn
