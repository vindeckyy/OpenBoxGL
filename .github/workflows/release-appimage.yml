name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
          expected_version="$(python3 -c 'import updates; print(updates.VERSION)')"
          test "$GITHUB_REF_NAME" = "v$expected_version" || {
            echo "tag $GITHUB_REF_NAME does not match updates.py version $expected_version" >&2
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            curl \
            file \
            binutils

      - name: Compile native host
        run: gcc -O2 native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Run test suite
        run: ./run_all_tests.sh

      - name: Build AppImage
        env:
          OPENBOX_APPDIR: ${{ runner.temp }}/OpenBox.AppDir
        run: ./build_appimage.sh "$PWD/OpenBox-x86_64.AppImage"

      - name: Write SHA-256 checksum
        run: sha256sum OpenBox-x86_64.AppImage | tee OpenBox-x86_64.AppImage.sha256

      - name: Generate SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/gen_sbom.py \
            --version "$VERSION" \
            --appdir "${RUNNER_TEMP}/OpenBox.AppDir" \
            --out "OpenBox-$VERSION-sbom.json"

      - name: Verify zsync metadata
        run: test -f OpenBox-x86_64.AppImage.zsync

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: openbox-release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            OpenBox-x86_64.AppImage
            OpenBox-x86_64.AppImage.zsync
            OpenBox-x86_64.AppImage.sha256
            OpenBox-*-sbom.json

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4.3.0
        with:
          name: openbox-release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance@v4.2.2
        with:
          subject-name: OpenBox-x86_64.AppImage
          subject-path: OpenBox-x86_64.AppImage

  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4.3.0
        with:
          name: openbox-release-assets

      - name: Validate annotated tag points at the build commit
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signing dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.0

      - name: Sign and verify release
        env:
          OPENBOX_SIGNING_KEY: ${{ secrets.OPENBOX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENBOX_SIGNING_KEY:-}" || {
            echo "OPENBOX_SIGNING_KEY is required; refusing to publish an unsigned release" >&2
            exit 1
          }
          umask 077
          key_file="$(mktemp)"
          public_key_file="$(mktemp)"
          trap 'rm -f -- "$key_file" "$public_key_file"' EXIT
          printf '%s' "$OPENBOX_SIGNING_KEY" > "$key_file"
          unset OPENBOX_SIGNING_KEY
          python3 scripts/sign_release.py \
            --key "$key_file" \
            --public-key-out "$public_key_file" \
            --out OpenBox-x86_64.AppImage.sig \
            OpenBox-x86_64.AppImage
          cmp -s "$public_key_file" openbox-release.pub || {
            echo "OPENBOX_SIGNING_KEY does not match the committed release public key" >&2
            exit 1
          }
          sha256sum --check --strict OpenBox-x86_64.AppImage.sha256
          python3 scripts/verify_release.py \
            --key openbox-release.pub \
            OpenBox-x86_64.AppImage \
            OpenBox-x86_64.AppImage.sig
          cp scripts/install.sh install.sh

      - name: Create release and upload signed assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OpenBox ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            OpenBox-x86_64.AppImage
            OpenBox-x86_64.AppImage.zsync
            OpenBox-x86_64.AppImage.sha256
            OpenBox-x86_64.AppImage.sig
            openbox-release.pub
            install.sh
            OpenBox-*-sbom.json
