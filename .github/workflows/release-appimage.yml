name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required by actions/attest-build-provenance (OIDC minting + attestation API).
  id-token: write
  attestations: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Publishing a release requires explicit human approval in the "release" environment.
    environment: release
    # Only one release build publishes at a time; a newer tag waits its turn
    # instead of cancelling the in-flight release.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            curl \
            file \
            binutils

      - name: Compile native host
        run: gcc -O2 native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Run test suite
        run: ./run_all_tests.sh

      - name: Build AppImage
        run: ./build_appimage.sh "$PWD/OpenBox-x86_64.AppImage"

      - name: Write SHA-256 checksum
        run: sha256sum OpenBox-x86_64.AppImage | tee OpenBox-x86_64.AppImage.sha256

      - name: Sign AppImage (Ed25519)
        # Runs only when the maintainer configures OPENBOX_SIGNING_KEY as a
        # repository secret; without it the release stays checksum-only.
        id: sign
        if: ${{ env.OPENBOX_SIGNING_KEY != '' }}
        run: |
          echo "$OPENBOX_SIGNING_KEY" > /tmp/openbox-release-key
          python3 scripts/sign_release.py --key /tmp/openbox-release-key --out OpenBox-x86_64.AppImage.sig OpenBox-x86_64.AppImage
          echo "sig-file=OpenBox-x86_64.AppImage.sig" >> "$GITHUB_OUTPUT"
        env:
          OPENBOX_SIGNING_KEY: ${{ secrets.OPENBOX_SIGNING_KEY }}

      - name: Generate SBOM
        id: sbom
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "sbom-file=OpenBox-$VERSION-sbom.json" >> "$GITHUB_OUTPUT"
          python3 scripts/gen_sbom.py --version "$VERSION" --out "OpenBox-$VERSION-sbom.json"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # actions/attest-build-provenance@v2
        with:
          subject-name: OpenBox-x86_64.AppImage
          subject-path: OpenBox-x86_64.AppImage

      - name: Verify zsync metadata
        run: test -f OpenBox-x86_64.AppImage.zsync

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: master
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            OpenBox-x86_64.AppImage
            OpenBox-x86_64.AppImage.zsync
            OpenBox-x86_64.AppImage.sha256
            ${{ steps.sign.outputs.sig-file }}
            ${{ steps.sbom.outputs.sbom-file }}
