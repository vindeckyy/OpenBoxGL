name: Release Flatpak

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-flatpak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
          expected_version="$(python3 -c 'import updates; print(updates.VERSION)')"
          test "$GITHUB_REF_NAME" = "v$expected_version" || {
            echo "tag $GITHUB_REF_NAME does not match updates.py version $expected_version" >&2
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak-builder \
            appstream \
            desktop-file-utils \
            elfutils \
            librsvg2-common \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            gcc \
            pkg-config

      - name: Validate packaging metadata
        run: |
          desktop-file-validate packaging/openbox.desktop
          if ! appstreamcli validate --no-net packaging/openbox.metainfo.xml; then
            python3 -B scripts/validate_flatpak_manifest.py
            grep -q 'type="homepage"' packaging/openbox.metainfo.xml
            grep -q 'type="bugtracker"' packaging/openbox.metainfo.xml
          fi
          if flatpak-builder --help 2>&1 | grep -q -- '--dry-run'; then
            flatpak-builder --dry-run --force-clean /tmp/ob-flatpak-dry packaging/io.openbox.GameLauncher.yml
          else
            python3 -B scripts/validate_flatpak_manifest.py
          fi

      - name: Compile native host
        run: gcc -O2 native/native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Run packaging tests
        run: python3 -B tests/test_packaging.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2

      - name: Build Rust openbox-server for Flatpak
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          cargo build --release --locked -p openbox-cli
          install -Dm755 "$RUNNER_TEMP/cargo-target/release/openbox-server" ./openbox-server
          ./openbox-server --dump-contracts >/dev/null

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo build-dir packaging/io.openbox.GameLauncher.yml
          test -x build-dir/files/share/openbox/openbox-server
          flatpak build-bundle repo "OpenBox-x86_64.flatpak" io.openbox.GameLauncher --arch=x86_64

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: openbox-flatpak
          if-no-files-found: error
          retention-days: 7
          path: OpenBox-x86_64.flatpak

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # AppImage and Flatpak publish jobs share one GitHub Release. Keep the
    # uploads serialized while allowing their build jobs to run in parallel.
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Flatpak artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
        with:
          name: openbox-flatpak

      - name: Compute release name
        id: relname
        run: |
          title="$(head -n 1 docs/RELEASE_NOTES.md | sed 's/^# //')"
          if [ -z "$title" ]; then
            title="OpenBox ${GITHUB_REF_NAME#v}"
          fi
          echo "name=$title" >> "$GITHUB_OUTPUT"

      - name: Create release and upload Flatpak
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.relname.outputs.name }}
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            OpenBox-x86_64.flatpak
