name: Release Flatpak

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-flatpak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
          expected_version="$(python3 -c 'import updates; print(updates.VERSION)')"
          test "$GITHUB_REF_NAME" = "v$expected_version" || {
            echo "tag $GITHUB_REF_NAME does not match updates.py version $expected_version" >&2
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak-builder \
            appstream \
            desktop-file-utils \
            elfutils \
            librsvg2-common \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            gcc \
            pkg-config

      - name: Validate packaging metadata
        run: |
          desktop-file-validate openbox.desktop
          if ! appstreamcli validate --no-net openbox.metainfo.xml; then
            python3 -B scripts/validate_flatpak_manifest.py
            grep -q 'type="homepage"' openbox.metainfo.xml
            grep -q 'type="bugtracker"' openbox.metainfo.xml
          fi
          if flatpak-builder --help 2>&1 | grep -q -- '--dry-run'; then
            flatpak-builder --dry-run --force-clean /tmp/ob-flatpak-dry io.openbox.GameLauncher.yml
          else
            python3 -B scripts/validate_flatpak_manifest.py
          fi

      - name: Compile native host
        run: gcc -O2 native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Run packaging tests
        run: python3 -B tests/test_packaging.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install gate tooling
        run: |
          python3 -m venv .venv-dev
          .venv-dev/bin/pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --ignore-scripts --prefix scripts

      - name: Version sync
        run: python3 scripts/check_version_sync.py

      # Same gate as pull requests: a tag may only publish a bundle built
      # from a tree that passes `make check`.
      - name: Full verification gate
        run: python3 scripts/check_tests.py

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo build-dir io.openbox.GameLauncher.yml
          flatpak build-bundle repo "OpenBox-x86_64.flatpak" io.openbox.GameLauncher --arch=x86_64

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: openbox-flatpak
          if-no-files-found: error
          retention-days: 7
          path: OpenBox-x86_64.flatpak

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          name: openbox-flatpak

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance@v4.2.2
        with:
          subject-name: OpenBox-x86_64.flatpak
          subject-path: OpenBox-x86_64.flatpak

  publish:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # AppImage and Flatpak publish jobs share one GitHub Release. Keep the
    # uploads serialized while allowing their build jobs to run in parallel.
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Flatpak artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          name: openbox-flatpak

      - name: Compute release name
        id: relname
        run: echo "name=OpenBox ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload Flatpak
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.relname.outputs.name }}
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            OpenBox-x86_64.flatpak
