name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 3 * * 1" # weekly drift check on master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: ./run_all_tests.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The feature-regression ratchets compare each contract against a
          # reference commit that predates the change. A depth-1 checkout has
          # no such commit, so layer 2 would silently degrade to layer 1.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # The suite is standalone scripts; the runner reports per-file
      # pass/fail/timeout and exits non-zero on any failure (ADR 0025).
      - name: Run test suite
        run: python -B scripts/run_windows_tests.py

      # native_host_win.c is C and Windows-only, so this is the only automated
      # proof that it still compiles against the WebView2 SDK (ADR 0048).
      - name: Build the WebView2 native host
        shell: pwsh
        run: |
          scripts/build_native_host_windows.ps1
          # Surface the exact host/SDK versions in the job log so a red build
          # is triageable without downloading artifacts. Single source of
          # truth: the #defines at the top of native_host_win.c.
          $hostVersion = (Select-String -Path native_host_win.c -Pattern '^#define NATIVE_HOST_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          $sdkVersion = (Select-String -Path native_host_win.c -Pattern '^#define WEBVIEW2_SDK_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          echo "native_host version: $hostVersion"
          echo "WebView2 SDK cache key: microsoft.web.webview2/$sdkVersion"

      - name: Runtime module manifest
        run: python -B scripts/check_runtime_modules.py

      - name: v1 route contract
        run: python -B scripts/check_v1_contract.py

      - name: Version sync
        run: python -B scripts/check_version_sync.py

      - name: i18n keys
        run: python -B scripts/check_i18n.py

      - name: CSP framing contract
        run: python -B scripts/check_csp.py

      - name: Design tokens
        run: python -B scripts/check_tokens.py

      # Feature-regression ratchets (ADR 0060). Pure-Python and platform
      # independent, so the Windows job is the proof they behave off Linux too.
      - name: HTTP route surface ratchet
        run: python -B scripts/check_routes_contract.py

      - name: Settings schema ratchet
        run: python -B scripts/check_settings_contract.py

      - name: Emulator definition contract
        run: python -B scripts/check_emulator_defs.py

      - name: Frontend module graph
        run: python -B scripts/check_frontend_modules.py

      - name: Reliability catalog
        run: python -B scripts/check_reliability_catalog.py

      - name: Clock-coupled tests
        run: python -B scripts/check_clock_coupling.py

  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 on the standard runner; aarch64 on GitHub's arm image
          # (ubuntu-22.04-arm deprecates 2026-09-17, so use 24.04-arm). ADR 0024.
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The feature-regression ratchets compare each contract against a
          # reference commit that predates the change. A depth-1 checkout has
          # no such commit, so layer 2 would silently degrade to layer 1.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dev tooling
        run: |
          python3 -m venv .venv-dev
          .venv-dev/bin/pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: .venv-dev/bin/ruff check .

      - name: JS lint and typecheck
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --ignore-scripts --prefix scripts
          python3 -B scripts/check_frontend.py

      # `npm audit` reports a registry outage and a real advisory with the same
      # non-zero exit code. Only the endpoint error is retried - a maintenance
      # window on registry.npmjs.org must not turn into a red gate that hides
      # whether the rest of the gate passed - and the loop still fails closed
      # when the service never answers.
      - name: Audit JavaScript dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            if output=$(npm audit --prefix scripts --audit-level=high 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output"
            case "$output" in
              *"audit endpoint returned an error"*|*"503 Service Unavailable"*) ;;
              *) exit 1 ;;
            esac
            if [ "$attempt" = 5 ]; then break; fi
            echo "npm audit endpoint unavailable (attempt $attempt); retrying"
            sleep $((attempt * 30))
          done
          echo "npm audit endpoint still unavailable" >&2
          exit 1

      - name: Version sync
        run: python3 scripts/check_version_sync.py

      # Feature-regression ratchets (ADR 0060). Also covered by the full gate
      # below; run standalone here so a regression names itself in the log
      # instead of only appearing as a non-zero exit from check_tests.py.
      - name: Feature-regression ratchets
        run: |
          for gate in check_routes_contract check_settings_contract \
                      check_emulator_defs check_frontend_modules \
                      check_reliability_catalog check_clock_coupling; do
            echo "::group::$gate"
            python3 -B "scripts/$gate.py" || exit 1
            echo "::endgroup::"
          done

      - name: Compile runtime modules
        run: |
          while IFS= read -r module; do
            [ -n "$module" ] || continue
            case "$module" in
              *.py) python3 -m py_compile "$module" ;;
            esac
          done < runtime_modules.txt
          python3 -m py_compile scripts/*.py
          if compgen -G "test_*.py" > /dev/null; then python3 -m py_compile test_*.py; fi
          if compgen -G "tests/test_*.py" > /dev/null; then python3 -m py_compile tests/test_*.py; fi

      - name: Compile native host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev xdg-utils
          gcc -O2 native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Full gate (coverage)
        run: python3 scripts/check_tests.py

      - name: Changed-line coverage (95%)
        run: python3 -B scripts/check_changed_coverage.py --fail-under=95

      - name: Whitespace hygiene
        run: |
          git diff --check
          if git ls-files | grep -E '\.(AppImage|pyc)$'; then
            echo "generated artifacts tracked by git"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S error -x run_all_tests.sh build_appimage.sh openbox.sh openbox-native.sh scripts/*.sh

  desktop-appstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate desktop and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate openbox.desktop
          appstreamcli validate --no-net openbox.metainfo.xml

  flatpak-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Dry-run Flatpak build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak-builder
          if flatpak-builder --help 2>&1 | grep -q -- '--dry-run'; then
            flatpak-builder --dry-run --force-clean /tmp/ob-flatpak-dry io.openbox.GameLauncher.yml
          else
            python3 -B scripts/validate_flatpak_manifest.py
          fi

  perf-20k:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Run 10k/20k performance gates
        env:
          OPENBOX_PERF_CI_MULT: "2.5"
        run: python3 -B scripts/perf_bench.py --sizes 10000,20000 --runs 5

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install puppeteer
        run: |
          cd scripts
          npm ci

      - name: Frontend smoke test
        run: ./scripts/ui_smoke.sh
