name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 3 * * 1" # weekly drift check on master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: ./run_all_tests.sh

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dev tooling
        run: |
          python3 -m venv .venv-dev
          .venv-dev/bin/pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: .venv-dev/bin/ruff check .

      - name: JS lint and typecheck
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --ignore-scripts --prefix scripts
          python3 -B scripts/check_frontend.py

      - name: Audit JavaScript dependencies
        run: npm audit --prefix scripts --audit-level=high

      - name: Version sync
        run: python3 scripts/check_version_sync.py

      - name: Compile runtime modules
        run: |
          while IFS= read -r module; do
            [ -n "$module" ] || continue
            case "$module" in
              *.py) python3 -m py_compile "$module" ;;
            esac
          done < runtime_modules.txt
          python3 -m py_compile scripts/*.py
          if compgen -G "test_*.py" > /dev/null; then python3 -m py_compile test_*.py; fi
          if compgen -G "tests/test_*.py" > /dev/null; then python3 -m py_compile tests/test_*.py; fi

      - name: Compile native host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
          gcc -O2 native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Full gate (coverage)
        run: python3 scripts/check_tests.py

      - name: Changed-line coverage (95%)
        run: python3 -B scripts/check_changed_coverage.py --fail-under=95

      - name: Whitespace hygiene
        run: |
          git diff --check
          if git ls-files | grep -E '\.(AppImage|pyc)$'; then
            echo "generated artifacts tracked by git"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S error -x run_all_tests.sh build_appimage.sh openbox.sh openbox-native.sh scripts/*.sh

  desktop-appstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate desktop and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate openbox.desktop
          appstreamcli validate --no-net openbox.metainfo.xml

  flatpak-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Dry-run Flatpak build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak-builder
          if flatpak-builder --help 2>&1 | grep -q -- '--dry-run'; then
            flatpak-builder --dry-run --force-clean /tmp/ob-flatpak-dry io.openbox.GameLauncher.yml
          else
            python3 -B scripts/validate_flatpak_manifest.py
          fi

  perf-20k:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Run 10k/20k performance gates
        env:
          OPENBOX_PERF_CI_MULT: "2.5"
        run: python3 -B scripts/perf_bench.py --sizes 10000,20000 --runs 5

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install puppeteer
        run: |
          cd scripts
          npm ci

      - name: Frontend smoke test
        run: ./scripts/ui_smoke.sh
