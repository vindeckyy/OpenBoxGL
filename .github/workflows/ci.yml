name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 3 * * 1" # weekly drift check on master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: ./run_all_tests.sh

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dev tooling
        run: |
          python3 -m venv .venv-dev
          .venv-dev/bin/pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: .venv-dev/bin/ruff check .

      - name: JS lint
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          # ESLint only, no Chromium is needed for this step. The lockfile
          # install skips lifecycle scripts, and this variable documents that
          # no browser download is expected in the gate job.
          npm ci --ignore-scripts --prefix scripts
          # Flat config's base path is the cwd, so lint static/ from the root
          # (npx eslint ../static/ from scripts/ would silently ignore files).
          ./scripts/node_modules/.bin/eslint --config scripts/eslint.config.mjs static/

      - name: Audit JavaScript dependencies
        run: npm audit --prefix scripts --audit-level=high

      - name: Version sync
        run: python3 scripts/check_version_sync.py

      - name: Compile runtime modules
        run: |
          while IFS= read -r module; do
            [ -n "$module" ] || continue
            case "$module" in
              *.py) python3 -m py_compile "$module" ;;
            esac
          done < runtime_modules.txt
          python3 -m py_compile scripts/*.py
          # Support both flat and tests/ layout after reorg
          if compgen -G "test_*.py" > /dev/null; then python3 -m py_compile test_*.py; fi
          if compgen -G "tests/test_*.py" > /dev/null; then python3 -m py_compile tests/test_*.py; fi

      - name: Compile native host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
          gcc -O2 native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Full gate (coverage)
        run: python3 scripts/check_tests.py

      - name: Whitespace hygiene
        run: |
          git diff --check
          if git ls-files | grep -E '\.(AppImage|pyc)$'; then
            echo "generated artifacts tracked by git"
            exit 1
          fi

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install puppeteer
        run: |
          cd scripts
          npm ci

      - name: Frontend smoke test
        run: ./scripts/ui_smoke.sh
