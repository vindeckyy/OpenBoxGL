name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 3 * * 1" # weekly drift check on master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: ./run_all_tests.sh

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: |
          python3 -m venv .venv-dev
          .venv-dev/bin/pip install ruff coverage

      - name: Lint
        run: .venv-dev/bin/ruff check .

      - name: Version sync
        run: python3 scripts/check_version_sync.py

      - name: Compile runtime modules
        run: |
          while IFS= read -r module; do
            [ -n "$module" ] || continue
            python3 -m py_compile "$module"
          done < runtime_modules.txt
          python3 -m py_compile test_*.py scripts/*.py

      - name: Compile native host
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          gcc -O2 native_host.c -o /tmp/native_host_check $(pkg-config --cflags --libs webkit2gtk-4.1)

      - name: Full gate (coverage)
        run: python3 scripts/check_tests.py

      - name: Whitespace hygiene
        run: |
          git diff --check
          if git ls-files | grep -E '\.(AppImage|pyc)$'; then
            echo "generated artifacts tracked by git"
            exit 1
          fi
