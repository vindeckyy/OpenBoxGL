version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: master
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    target-branch: master
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: master
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
