name: Bug report
description: Report a reproducible defect in OpenBox
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please search [existing issues](https://github.com/vindeckyy/OpenBoxGL/issues) first. The current release is [v1.10.0](https://github.com/vindeckyy/OpenBoxGL/releases/latest).

  - type: input
    id: version
    attributes:
      label: OpenBox version
      description: Release tag, AppImage version, or git commit hash
      placeholder: v1.10.0
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Web UI
        - Native window
        - AppImage
        - Flatpak
        - Source install
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distro, desktop environment, and Python version if running from source
      placeholder: Fedora 42, KDE Plasma, Python 3.12
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that consistently trigger the issue
      placeholder: |
        1. Launch OpenBox
        2. Open Settings
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: Paste the output of Settings -> Library Audit -> the diagnostic log, or the "Copy details" output from an error banner. It is redacted automatically.
    validations:
      required: false

  - type: input
    id: library_size
    attributes:
      label: Library size
      description: Roughly how many games are in the library
      placeholder: e.g. 400
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact tokens, paths, or credentials before posting
    validations:
      required: false
