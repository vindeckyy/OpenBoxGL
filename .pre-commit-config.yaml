repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: py-compile
        name: py-compile
        # ``python`` (not ``python3``): the dev venv provides it on every
        # platform, while Windows only ships a broken ``python3`` store alias.
        entry: python -B -m py_compile
        language: system
        types: [python]
        pass_filenames: true
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        args: [--markdown-linebreak-ext=md]
