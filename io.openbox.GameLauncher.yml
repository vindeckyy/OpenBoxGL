app-id: io.openbox.GameLauncher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: openbox
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=home

modules:
  - name: openbox
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/openbox
      - for f in openbox.py web_app.py importers.py arcade.py catalog.py cloud_sync.py emulators.py retroachievements.py plugins.py plugin_runner.py metadata.py archives.py saves.py updates.py env_config.py parity_discovery.py parity_import.py parity_integrations.py parity_media.py parity_saves.py parity_storefront.py plugin_catalog.py parity_premium.py stock_themes.py index.html; do install -Dm644 "$f" "/app/share/openbox/$f"; done
      - mkdir -p /app/share/openbox/themes
      - for f in themes/*.css; do install -Dm644 "$f" "/app/share/openbox/$f"; done
      - install -Dm755 openbox.sh /app/bin/openbox
      - install -Dm755 openbox-native.sh /app/bin/openbox-native
      - install -Dm644 openbox.desktop /app/share/applications/io.openbox.GameLauncher.desktop
      - install -Dm644 openbox.svg /app/share/icons/hicolor/scalable/apps/io.openbox.GameLauncher.svg
      - install -Dm644 openbox.metainfo.xml /app/share/metainfo/io.openbox.GameLauncher.metainfo.xml
    sources:
      - type: dir
        path: .
