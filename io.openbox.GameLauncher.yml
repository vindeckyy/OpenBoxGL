app-id: io.openbox.GameLauncher
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: openbox
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=home

modules:
  - name: native-host
    buildsystem: simple
    build-commands:
      - gcc -O2 native_host.c -o native_host $(pkg-config --cflags --libs webkit2gtk-4.1)
      - install -Dm755 native_host /app/share/openbox/native_host
    sources:
      - type: dir
        path: .
  - name: openbox
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/openbox
      - while IFS= read -r f; do [ -n "$f" ] || continue; install -Dm644 "$f" "/app/share/openbox/$f"; done < runtime_modules.txt
      - install -Dm644 index.html /app/share/openbox/index.html
      - for f in static/*.js static/*.css; do install -Dm644 "$f" "/app/share/openbox/$f"; done
      - install -Dm644 assets/openbox-logo.png /app/share/openbox/assets/openbox-logo.png
      - install -Dm644 plugins/catalog.json /app/share/openbox/plugins/catalog.json
      - install -d /app/share/openbox/emulator_defs
      - for f in emulator_defs/*.yaml; do install -Dm644 "$f" "/app/share/openbox/emulator_defs/"; done
      - install -Dm755 scripts/openbox-launcher.sh /app/share/openbox/openbox-launcher.sh
      - mkdir -p /app/share/openbox/themes
      - for f in themes/*.css; do install -Dm644 "$f" "/app/share/openbox/$f"; done
      - install -Dm755 openbox.sh /app/bin/openbox
      - install -Dm755 openbox-native.sh /app/bin/openbox-native
      - install -Dm644 openbox.desktop /app/share/applications/io.openbox.GameLauncher.desktop
      - install -Dm644 openbox.svg /app/share/icons/hicolor/scalable/apps/io.openbox.GameLauncher.svg
      - install -Dm644 openbox.metainfo.xml /app/share/metainfo/io.openbox.GameLauncher.metainfo.xml
    sources:
      - type: dir
        path: .
